name: Preview Cloudflare

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verificar autenticação ou publicar o preview
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  preview:
    name: ${{ inputs.operation == 'deploy' && 'Deploy preview' || 'Verify Cloudflare access' }}
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Actions secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Actions secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx wrangler whoami
          npx wrangler d1 list

      - name: Validate preview configuration
        if: inputs.operation == 'deploy'
        env:
          PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
          PREVIEW_TURNSTILE_SITE_KEY: ${{ vars.PREVIEW_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PREVIEW_D1_DATABASE_ID PREVIEW_TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY PASSWORD_PEPPER; do
            test -n "${!name}" || { echo "Missing preview Actions secret/variable: $name"; exit 1; }
          done
          [[ "$PREVIEW_TURNSTILE_SITE_KEY" == 0x* ]] || {
            echo 'PREVIEW_TURNSTILE_SITE_KEY must be the Site Key (starting with 0x), not an Account ID.'
            exit 1
          }
          node - <<'NODE'
          import fs from 'node:fs';
          const path = 'wrangler.jsonc';
          let config = fs.readFileSync(path, 'utf8');
          config = config.replace('PREVIEW_D1_DATABASE_ID', process.env.PREVIEW_D1_DATABASE_ID)
            .replace('PREVIEW_TURNSTILE_SITE_KEY', process.env.PREVIEW_TURNSTILE_SITE_KEY);
          if (config.includes('PREVIEW_D1_DATABASE_ID') || config.includes('PREVIEW_TURNSTILE_SITE_KEY')) {
            throw new Error('Preview placeholders were not replaced');
          }
          fs.writeFileSync(path, config);
          NODE

      - name: Validate Wrangler preview schema
        if: inputs.operation == 'deploy'
        run: |
          npm run assets:prepare
          npx wrangler deploy --env preview --dry-run --outdir .wrangler/preview-dry-run

      - name: Configure Worker secrets
        if: inputs.operation == 'deploy'
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --env preview
          printf '%s' "$PASSWORD_PEPPER" | npx wrangler secret put PASSWORD_PEPPER --env preview

      - name: Apply preview migrations
        if: inputs.operation == 'deploy'
        run: npm run db:migrate:preview

      - name: Update existing preview administrator
        if: inputs.operation == 'deploy'
        env:
          ADMIN_DATABASE: membros-preview
          ADMIN_REMOTE: 'true'
        run: npm run admin:update:preview

      - name: Deploy preview Worker and custom domain
        if: inputs.operation == 'deploy'
        run: npx wrangler deploy --env preview

      - name: Smoke test published preview
        if: inputs.operation == 'deploy'
        env:
          PREVIEW_TURNSTILE_SITE_KEY: ${{ vars.PREVIEW_TURNSTILE_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          origin='https://membros-preview.evandroavila.com.br'
          for attempt in {1..12}; do
            html="$(curl --fail --silent --show-error "$origin/login")" &&
            config="$(curl --fail --silent --show-error "$origin/api/v1/config")" && break
            test "$attempt" -eq 12 && exit 1
            sleep 5
          done
          asset_path="$(sed -n 's|.*src="\(/js/app\.[a-f0-9]\{12\}\.js\)".*|\1|p' <<<"$html")"
          test -n "$asset_path"
          app="$(curl --fail --silent --show-error "$origin$asset_path")"
          grep -Fq 'E-mail ou telefone' <<<"$app"
          grep -Fq 'fetch(`/api/v1/auth/${endpoint}`' <<<"$app"
          expected_hash="$(sha256sum public/js/app.js | cut -c1-12)"
          test "$asset_path" = "/js/app.${expected_hash}.js"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data '{"identifier":"smoke@example.com","password":"invalid","turnstileToken":"invalid"}' \
            "$origin/api/v1/auth/login")" = '400'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","turnstileToken":"invalid"}' \
            "$origin/api/v1/auth/forgot-password")" = '200'
          CONFIG="$config" node - <<'NODE'
          const config = JSON.parse(process.env.CONFIG);
          if (config.turnstileSiteKey !== process.env.PREVIEW_TURNSTILE_SITE_KEY) {
            throw new Error('Published Turnstile Site Key does not match the preview variable');
          }
          NODE
