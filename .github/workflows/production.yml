name: Production Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Wrangler resolves assets.directory as soon as it loads wrangler.jsonc.
      # Materialize dist before any validation or deployment command can invoke it.
      - name: Prepare production assets
        run: |
          npm run assets:prepare
          test -d dist

      - name: Validate production credentials and security configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PASSWORD_PEPPER; do
            test -n "${!name}" || { echo "Missing production secret/variable: $name"; exit 1; }
          done
          node - <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.vars.TURNSTILE_SITE_KEY !== '0x4AAAAAAE_Epyppm4T7SENx') {
            throw new Error('wrangler.jsonc does not contain the production Turnstile Site Key');
          }
          if (config.keep_vars !== true) throw new Error('wrangler.jsonc must preserve runtime secrets and variables');
          NODE
          npx wrangler whoami

      - name: Resolve the exclusive production D1 database
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json)"
          database_uuid="$(DATABASES="$databases" node - <<'NODE'
          const databases = JSON.parse(process.env.DATABASES);
          const production = databases.filter(({ name }) => name === 'membros-producao');
          if (production.length > 1) throw new Error('More than one membros-producao database exists');
          process.stdout.write(production[0]?.uuid ?? '');
          NODE
          )"
          if [ -z "$database_uuid" ]; then
            npx wrangler d1 create membros-producao
            databases="$(npx wrangler d1 list --json)"
            database_uuid="$(DATABASES="$databases" node -e \
              "const values=JSON.parse(process.env.DATABASES); const value=values.find(({name})=>name==='membros-producao'); process.stdout.write(value?.uuid ?? '')")"
          fi
          [[ "$database_uuid" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Cloudflare did not return a valid production D1 UUID.'; exit 1; }
          echo "PRODUCTION_DATABASE_UUID=$database_uuid" >> "$GITHUB_ENV"

      - name: Materialize verified public bindings
        shell: bash
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const path = 'wrangler.jsonc';
          let config = fs.readFileSync(path, 'utf8');
          for (const [token, value] of [
            ['PRODUCTION_DATABASE_NAME', 'membros-producao'],
            ['PRODUCTION_DATABASE_UUID', process.env.PRODUCTION_DATABASE_UUID],
          ]) config = config.replace(token, value);
          fs.writeFileSync(path, config);
          NODE

      - name: Check and test
        run: |
          npm run check
          npm test
          npx wrangler deploy --env="" --dry-run --outdir .wrangler/production-dry-run

      - name: Configure managed production secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PASSWORD_PEPPER" | npx wrangler secret put PASSWORD_PEPPER --env=""

      - name: Apply production migrations
        run: npm run db:migrate:production

      - name: Deploy production Worker and custom domain
        run: npm run deploy

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          origin='https://membros.evandroavila.com.br'
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$origin/login" >/dev/null
          config="$(curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$origin/api/v1/config")"
          CONFIG="$config" node - <<'NODE'
          const config = JSON.parse(process.env.CONFIG);
          if (config.turnstileSiteKey !== '0x4AAAAAAE_Epyppm4T7SENx') {
            throw new Error('Published Turnstile Site Key does not match production');
          }
          NODE
          html="$(curl --fail "$origin/login")"
          asset_path="$(sed -n 's|.*src="\(/js/app\.[a-f0-9]\{12\}\.js\)".*|\1|p' <<<"$html")"
          test -n "$asset_path"
          app="$(curl --fail "$origin$asset_path")"
          ! grep -Eq 'localhost|membros-preview' <<<"$app"
          ! grep -Fq 'Cadastre-se' <<<"$app"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$origin/cadastro")" = '302'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","password":"senha-segura-123","name":"Membro"}' \
            "$origin/api/v1/auth/register")" = '404'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data '{"identifier":"smoke@example.com","password":"invalid","turnstileToken":"invalid"}' \
            "$origin/api/v1/auth/login")" = '400'
