<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área de Membros | Evandro Avila</title>
  <meta name="description" content="Acesse a área de membros de Evandro Avila.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="member-area">
    <section class="access-card" aria-labelledby="page-title">
      <header class="brand">
        <div class="brand__logo" aria-label="Espaço reservado para a logo oficial">
          <!-- LOGO OFICIAL SERÁ INSERIDA APÓS O MERGE -->
        </div>
        <p class="brand__name">Evandro Avila</p>
      </header>

      <div class="access-card__content">
        <p class="eyebrow">Conteúdo exclusivo</p>
        <h1 id="page-title">Área de Membros</h1>
        <p class="intro">Bem-vindo. Seu conteúdo está reunido em um ambiente simples, organizado e feito para você.</p>
        <a class="access-button" href="#conteudo">Acessar conteúdo</a>
      </div>
    </section>

    <section class="content-preview" id="conteudo" aria-labelledby="content-title">
      <p class="eyebrow">Sua jornada continua aqui</p>
      <h2 id="content-title">Conteúdo da área de membros</h2>
      <p>Em breve, os seus materiais estarão disponíveis neste espaço.</p>
    </section>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
